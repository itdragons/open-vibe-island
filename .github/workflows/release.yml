name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      # Rolling pre-release builds from the wg working branch. These publish a
      # prerelease with downloadable artifacts but never touch appcast/homebrew
      # or the main branch — see the "mode" gating below.
      - 'wg'

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release mode
        id: version
        run: |
          # A v* tag → full official release. The wg branch → rolling prerelease
          # that produces downloadable artifacts only (no appcast/homebrew/main).
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "mode=prerelease" >> "$GITHUB_OUTPUT"
            echo "version=0.0.0-wg.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "release_tag=wg-latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          brew install create-dmg
          pip3 install --break-system-packages Pillow

      - name: Import signing certificate
        id: signing
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SKIP_SIGN: ${{ vars.SKIP_SIGN }}
          SKIP_NOTARIZE: ${{ vars.SKIP_NOTARIZE }}
        run: |
          # No certificate available (opt-out or missing secret) → produce an
          # ad-hoc signed, unsigned release instead of failing the whole run.
          if [[ "${SKIP_SIGN:-}" == "true" || -z "$CERTIFICATE_P12" ]]; then
            reason="SKIP_SIGN=${SKIP_SIGN:-<unset>}, certificate present: $([[ -n "$CERTIFICATE_P12" ]] && echo yes || echo no)"
            echo "::warning::Skipping code signing ($reason). Producing an ad-hoc (unsigned) release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "notary_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Decode the p12 certificate from base64
          CERT_FILE="$(mktemp).p12"
          echo "$CERTIFICATE_P12" | base64 --decode > "$CERT_FILE"

          # Create a temporary keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import the certificate (.p12 = identity = cert + private key).
          # A failure here almost always means the APPLE_CERTIFICATE_P12 secret
          # is not valid base64 of a .p12, or APPLE_CERTIFICATE_PASSWORD is wrong.
          if ! security import "$CERT_FILE" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"; then
            echo "::error::Failed to import APPLE_CERTIFICATE_P12. Verify the secret is base64 of a valid .p12 (base64 -b 0 -i cert.p12) and that APPLE_CERTIFICATE_PASSWORD matches. To ship an unsigned build instead, set repository variable SKIP_SIGN=true."
            exit 1
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          # Add the keychain to the search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # Store notarytool credentials in the keychain when possible. Apple
          # can reject credential validation while legal agreements are pending
          # or expired; keep the release moving as a signed, non-notarized build
          # in that case and let the later notarization step skip itself.
          if [[ "${SKIP_NOTARIZE:-}" == "true" ]]; then
            echo "Skipping notarytool credential setup because SKIP_NOTARIZE is true."
            echo "notary_ready=false" >> "$GITHUB_OUTPUT"
          elif xcrun notarytool store-credentials "open-island-notary" \
              --apple-id "${{ secrets.APPLE_ID }}" \
              --team-id "${{ secrets.APPLE_TEAM_ID }}" \
              --password "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
              --keychain "$KEYCHAIN_PATH"; then
            echo "notary_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Notary credential validation failed; continuing with a signed, non-notarized release."
            echo "notary_ready=false" >> "$GITHUB_OUTPUT"
          fi

          # Clean up
          rm -f "$CERT_FILE"

      - name: Build and package (signed)
        env:
          OPEN_ISLAND_APP_NAME: "Open Island"
          OPEN_ISLAND_BUNDLE_ID: "app.openisland.OpenIsland"
          OPEN_ISLAND_VERSION: ${{ steps.version.outputs.version }}
          OPEN_ISLAND_BUILD_NUMBER: ${{ github.run_number }}
          OPEN_ISLAND_SIGN_IDENTITY: ${{ steps.signing.outputs.signed == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          OPEN_ISLAND_UNIVERSAL: "true"
        run: zsh scripts/package-app.sh

      - name: Verify artifacts
        run: |
          test -f "output/package/Open Island.zip"
          test -f "output/package/Open Island.dmg"
          ls -lh output/package/

      - name: Verify code signature
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          bundle="output/package/Open Island.app"
          echo "--- Signature info ---"
          codesign -dvv "$bundle" || true
          if [[ "$SIGNED" == "true" ]]; then
            echo ""
            echo "--- Signature verification ---"
            codesign --verify --deep --strict --verbose=2 "$bundle"
          else
            echo "Ad-hoc (unsigned) build; skipping strict Developer ID verification."
          fi

      - name: Verify bundle structure
        run: |
          bundle="output/package/Open Island.app"
          echo "--- Bundle contents ---"
          find "$bundle" -maxdepth 3 -type f | sort

          # Required files
          for f in \
            "Contents/MacOS/OpenIslandApp" \
            "Contents/Helpers/OpenIslandHooks" \
            "Contents/Helpers/OpenIslandSetup" \
            "Contents/Resources/OpenIsland.icns" \
            "Contents/Resources/OpenIsland_OpenIslandApp.bundle" \
          ; do
            if [[ ! -e "$bundle/$f" ]]; then
              echo "::error::Missing required file: $f"
              exit 1
            fi
          done

          echo "Bundle structure OK"

      - name: Notarize (best-effort)
        if: vars.SKIP_NOTARIZE != 'true' && steps.signing.outputs.notary_ready == 'true'
        id: notarize
        continue-on-error: true
        env:
          OPEN_ISLAND_APP_NAME: "Open Island"
        run: |
          bundle="output/package/$OPEN_ISLAND_APP_NAME.app"
          zip_path="output/package/$OPEN_ISLAND_APP_NAME.zip"
          dmg_path="output/package/$OPEN_ISLAND_APP_NAME.dmg"

          echo "Submitting for notarization..."
          xcrun notarytool submit "$zip_path" \
            --keychain-profile "open-island-notary" \
            --wait --timeout 10m || { echo "::warning::Notarization failed or timed out"; exit 1; }

          echo "Stapling app bundle..."
          xcrun stapler staple -v "$bundle"

          # Re-create zip with stapled bundle
          rm -f "$zip_path"
          ditto -c -k --keepParent "$bundle" "$zip_path"

          # Re-sign and notarize DMG
          codesign --force --sign "${{ secrets.APPLE_SIGNING_IDENTITY }}" --timestamp "$dmg_path"
          xcrun notarytool submit "$dmg_path" \
            --keychain-profile "open-island-notary" \
            --wait --timeout 10m || { echo "::warning::DMG notarization failed or timed out"; exit 1; }
          xcrun stapler staple -v "$dmg_path"

          echo "notarized=true" >> "$GITHUB_OUTPUT"

      - name: Sign update with EdDSA (Sparkle)
        id: sparkle_sign
        env:
          SPARKLE_EDDSA_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
        run: |
          sign_tool=".build/artifacts/sparkle/Sparkle/bin/sign_update"
          zip_path="output/package/Open Island.zip"

          if [[ -z "$SPARKLE_EDDSA_KEY" ]]; then
            echo "::warning::SPARKLE_EDDSA_KEY not set — skipping appcast update"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # sign_update reads the private EdDSA key from stdin via --ed-key-file -
          sign_output="$(echo "$SPARKLE_EDDSA_KEY" | "$sign_tool" "$zip_path" --ed-key-file -)"
          ed_signature="$(echo "$sign_output" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')"
          length="$(echo "$sign_output" | sed -n 's/.*length="\([^"]*\)".*/\1/p')"

          echo "ed_signature=$ed_signature" >> "$GITHUB_OUTPUT"
          echo "length=$length" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "EdDSA signature: $ed_signature (length: $length)"

      - name: Update appcast.xml
        if: steps.version.outputs.mode == 'release' && steps.sparkle_sign.outputs.signed == 'true'
        run: |
          zsh scripts/update-appcast.sh \
            "${{ steps.version.outputs.version }}" \
            "${{ github.run_number }}" \
            "${{ steps.sparkle_sign.outputs.ed_signature }}" \
            "${{ steps.sparkle_sign.outputs.length }}"
          cat appcast.xml

      - name: Update appcast.xml via PR
        if: steps.version.outputs.mode == 'release' && steps.sparkle_sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="chore/appcast-v${{ steps.version.outputs.version }}"
          # Save the updated appcast.xml before switching branches
          cp appcast.xml /tmp/appcast.xml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -f -b "$branch" origin/main
          cp /tmp/appcast.xml appcast.xml
          git add appcast.xml
          git commit -m "chore: update appcast.xml for v${{ steps.version.outputs.version }}"
          git push --force origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: update appcast.xml for v${{ steps.version.outputs.version }}" \
            --body "Automated appcast.xml update from release workflow."
          gh pr merge "$branch" --merge --admin --delete-branch

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ steps.version.outputs.mode }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          dmg="output/package/Open Island.dmg#Open Island.dmg (macOS, Universal)"
          zip="output/package/Open Island.zip#Open Island.zip (macOS, Universal)"
          if [[ "$MODE" == "prerelease" ]]; then
            # Rolling prerelease for the wg branch: replace the previous one so
            # the tag always points at the latest wg commit. Marked prerelease
            # so it never becomes the repository's "Latest" release.
            gh release delete "$RELEASE_TAG" --cleanup-tag --yes || true
            gh release create "$RELEASE_TAG" \
              --title "Open Island (wg build ${RUN_NUMBER})" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --notes "Automated pre-release build from the \`wg\` branch (run ${RUN_NUMBER}, commit ${GITHUB_SHA:0:7}). Not an official release." \
              "$dmg" \
              "$zip"
          else
            gh release create "$RELEASE_TAG" \
              --title "Open Island $RELEASE_TAG" \
              --generate-notes \
              --notes-start-tag "$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo '')" \
              --draft \
              "$dmg" \
              "$zip"
          fi

      - name: Append install instructions to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTARIZED: ${{ steps.notarize.outputs.notarized }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          existing="$(gh release view "$RELEASE_TAG" --json body -q .body)"
          if [[ "$NOTARIZED" == "true" ]]; then
            install_note="> This build is signed and notarized by Apple. It will launch without Gatekeeper warnings."
          elif [[ "$SIGNED" == "true" ]]; then
            install_note="> This build is signed with a Developer ID certificate. On first launch, right-click → **Open** to bypass Gatekeeper."
          else
            install_note=$'> This build is **not signed** with a Developer ID certificate. macOS Gatekeeper will block it on first launch.\n>\n> After moving the app to **Applications**, run this once in Terminal to allow it:\n>\n> ```\n> xattr -dr com.apple.quarantine \"/Applications/Open Island.app\"\n> ```'
          fi
          gh release edit "$RELEASE_TAG" --notes "$(cat <<EOF
          ${existing}

          ---

          ## Installation

          1. Download **Open Island.dmg**, open it, and drag **Open Island** to **Applications**.
          2. Requires **macOS 14+** (Apple Silicon and Intel).

          ${install_note}
          EOF
          )"

      - name: Update Homebrew tap cask
        if: steps.version.outputs.mode == 'release' && vars.SKIP_HOMEBREW != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::warning::HOMEBREW_TAP_TOKEN not set — skipping homebrew tap update"
            exit 0
          fi

          dmg_path="output/package/Open Island.dmg"
          sha256="$(shasum -a 256 "$dmg_path" | awk '{print $1}')"
          echo "DMG sha256: $sha256"

          workdir="$(mktemp -d)"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/Octane0411/homebrew-tap.git" "$workdir/tap"
          cd "$workdir/tap"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          branch="bump/openisland-v${VERSION}"
          git checkout -b "$branch"

          sed -i '' \
            -e "s/^  version \".*\"/  version \"${VERSION}\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"${sha256}\"/" \
            Casks/openisland.rb

          if git diff --quiet; then
            echo "Cask already at v${VERSION}, nothing to do"
            exit 0
          fi

          git add Casks/openisland.rb
          git commit -m "openisland: bump to v${VERSION}"
          git push --force origin "$branch"

          gh pr create \
            --repo Octane0411/homebrew-tap \
            --base main \
            --head "$branch" \
            --title "openisland: bump to v${VERSION}" \
            --body "Automated bump from https://github.com/Octane0411/open-vibe-island/releases/tag/v${VERSION}"
          gh pr merge "$branch" --repo Octane0411/homebrew-tap --merge --delete-branch

      - name: Refresh contributors image cache via PR
        if: steps.version.outputs.mode == 'release'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          timestamp="$(date +%s)"
          branch="chore/contributors-v${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -f -b "$branch" origin/main
          for file in README.md README.zh-CN.md; do
            sed -i '' "s|contrib.rocks/image?repo=Octane0411/open-vibe-island&t=[0-9]*|contrib.rocks/image?repo=Octane0411/open-vibe-island\&t=${timestamp}|g" "$file"
          done
          if git diff --quiet; then
            echo "No contributors timestamp changes detected, skipping."
            exit 0
          fi
          git add README.md README.zh-CN.md
          git commit -m "chore: refresh contributors image cache for v${{ steps.version.outputs.version }}"
          git push --force origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: refresh contributors image cache for v${{ steps.version.outputs.version }}" \
            --body "Automated contrib.rocks cache-bust from release workflow."
          gh pr merge "$branch" --merge --admin --delete-branch

      - name: Cleanup keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
